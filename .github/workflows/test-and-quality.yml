name: Test and Quality

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-and-quality:
    name: Everything
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: TruffleHog OSS
        uses: chainguard-actions/trufflesecurity-trufflehog@37c48063e8e4c01c8bcf36462ad7ec927638416d # v3.99.8
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Set up Python
        uses: chainguard-actions/actions-setup-python@54626a9f20a67b48c7f84a1362272e3a2e22000c # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: chainguard-actions/astral-sh-setup-uv@d074662c6bd48040f94d5f5eeae1479d285f0177 # v10.3.3
        with:
          enable-cache: true
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff check
        run: uv run ruff check --output-format=github .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run python -m pytest --cov=src/lib --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: coverage-report
          path: coverage.xml

      - name: Initialize CodeQL
        uses: chainguard-actions/github-codeql-action/init@e4969b640f7a67163769dc6d910d19032366881b # v4.39.3
        with:
          languages: "python"

      - name: Autobuild
        uses: chainguard-actions/github-codeql-action/autobuild@e4969b640f7a67163769dc6d910d19032366881b # v4.39.3

      - name: Perform CodeQL Analysis
        uses: chainguard-actions/github-codeql-action/analyze@e4969b640f7a67163769dc6d910d19032366881b # v4.39.3
        with:
          category: "/language:python"
