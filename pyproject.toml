[project]
name = "tsujimoto"
version = "0.1.0"
description = "Neural networks for Japanese kanji character recognition using ETL9G dataset"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "paazmaya", email = "paazmaya@yahoo.com" }]
keywords = [
  "kanji",
  "recognition",
  "machine-learning",
  "etl9g",
  "japanese",
  "character-recognition",
  "pytorch",
  "onnx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

dependencies = [
  # Core ML framework with CUDA support
  "torch>=2.10.0",
  "torchvision>=0.24.1",
  "pytorch-lightning>=2.1.0",
  # Data processing and utilities
  "numpy>=2.3.3",
  "scikit-learn>=1.7.2",
  "matplotlib>=3.10.7",
  "tqdm>=4.67.1",
  "opencv-python>=4.11.0",
  "Pillow>=12.1.0",
  # Configuration and validation
  "pydantic>=2.5.0",
  # Model export and deployment
  "onnx>=1.20.1",
  "onnxruntime>=1.23.2",
  "onnxruntime-tools>=1.7.0",
  # CO2 emissions tracking
  "codecarbon>=3.2.1",
  # System monitoring
  "psutil>=7.2.0",
  "loguru>=0.7.2",
  "py-cpuinfo>=9.0.0",
  "gpustat>=1.1.1",
  # Data handling
  "safetensors>=0.7.0",
  "bitsandbytes>=0.49.1",
  # Phase 4: Data pipeline and CLI
  "datasets>=2.14.0",
  "typer>=0.9.0",
  "huggingface-hub>=0.21.0",
  # Phase 5-8: Advanced training methods
  "albumentations>=1.4.0", # Image degradation & augmentation (Phase 3)
  "pytorch-metric-learning>=2.3.0", # Contrastive learning (Phase 5)
  "ultralytics>=8.3.0", # YOLOv8/v12 detection (Phase 6)
  "kornia>=0.7.0", # Advanced image transformations (Phase 3, 6)
  "faiss-cpu>=1.8.0", # Efficient similarity search (Phase 1)
]

[project.optional-dependencies]
dev = ["ruff>=0.14.5", "pytest>=9.0.3", "pytest-cov>=5.0.0"]

[dependency-groups]
dev = ["ruff>=0.14.5", "pytest>=9.0.3"]

[project.urls]
Homepage = "https://github.com/paazmaya/tsujimoto"
Repository = "https://github.com/paazmaya/tsujimoto"
Issues = "https://github.com/paazmaya/tsujimoto/issues"

# PyTorch wheels: Platform-aware index selection
# On Mac: uses CPU wheels (compatible with both Intel and Apple Silicon)
# On Linux/Windows: uses CUDA 13.0 wheels for GPU support
# Installation will auto-select based on platform and PyTorch version
# For Mac with Metal Performance Shaders (MPS), torch CPU wheels still work
[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = false
packages = ["torch", "torchvision"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "ISC", "PIE", "T20", "Q"]
ignore = ["E501", "S101", "S311"]

# ML/data science code uses uppercase variable names for matrices and tensors (X, Y, K, Q, V, etc.)
[tool.ruff.lint.per-file-ignores]
"scripts/train_cnn_model.py" = ["N806"]
"scripts/train_vit.py" = ["N806"]
"scripts/train_qat.py" = ["N806"]
"scripts/train_hiercode.py" = ["N806"]
"scripts/train_radical_rnn.py" = ["N806"]
"scripts/train_hiercode_higita.py" = ["N806"]
"scripts/optimization_config.py" = ["N806"]
"scripts/load_multi_etl.py" = ["N806"]
"scripts/prepare_dataset.py" = ["N806"]
"scripts/convert_to_safetensors.py" = ["N806"]
"scripts/convert_to_onnx.py" = ["N806"]
"scripts/quantize_model.py" = ["N806"]
"scripts/verify_etl9g_setup.py" = ["N806"]
"scripts/rnn/rnn_model.py" = ["N806"]

[tool.pytest.ini_options]
# Ignore known deprecation warnings from external libraries
# These are not our code and will be fixed upstream
filterwarnings = [
    # Typer/Click deprecation - will be fixed in Click 9.0 / Typer update
    "ignore:.*click.utils.get_binary_stream.*:DeprecationWarning",
    "ignore:.*click.utils.get_text_stream.*:DeprecationWarning",
    # PyTorch JIT deprecation - will be fixed when PyTorch switches to torch.compile
    "ignore:.*torch.jit.script.*:DeprecationWarning",
    "ignore:.*torch.jit.script_method.*:DeprecationWarning",
    # PyTorch quantization deprecation - will migrate to torchao when more stable on Mac
    "ignore:.*torch.ao.quantization.*:DeprecationWarning",
]
